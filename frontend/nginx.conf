server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ─────────────────────────────────────────
    # /pantries/<slug> is a client-side route, not a file: fall back to
    # index.html so the Angular router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.json is written at container start and must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ─────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}

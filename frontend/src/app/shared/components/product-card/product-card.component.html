<div class="card" [attr.data-status]="item().status">
  <ion-button
    class="settings"
    fill="clear"
    size="small"
    [attr.aria-label]="'Settings for ' + item().product.name"
    (click)="settingsOpened.emit(item())"
  >
    <ion-icon slot="icon-only" name="ellipsis-horizontal" />
  </ion-button>

  <button
    type="button"
    class="body"
    [attr.aria-label]="
      item().status === 'ARCHIVED'
        ? item().product.name + ' is archived'
        : 'Change stock of ' + item().product.name
    "
    [disabled]="item().status === 'ARCHIVED'"
    (click)="statusToggled.emit(item())"
  >
    <img class="image" [src]="imageUrl()" [alt]="item().product.name" loading="lazy" />
    <span class="name">{{ item().product.name }}</span>
    <app-status-pill [status]="item().status" />
  </button>
</div>

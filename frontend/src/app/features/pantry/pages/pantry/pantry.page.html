<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/" aria-label="New pantry">
        <ion-icon slot="icon-only" name="home-outline" />
      </ion-button>
    </ion-buttons>

    <ion-title>{{ store.pantry()?.name ?? 'Pantry' }}</ion-title>

    <ion-buttons slot="end">
      <ion-button
        (click)="confirmReset()"
        [disabled]="store.resetting()"
        aria-label="Reset all active products to pending"
      >
        <ion-icon slot="icon-only" name="refresh-outline" />
      </ion-button>
      <ion-button
        (click)="openStatusFilter()"
        [color]="store.status() === 'ALL' ? undefined : 'primary'"
        [attr.aria-label]="
          store.status() === 'ALL' ? 'Filter by status' : 'Status: ' + store.status()
        "
      >
        <ion-icon slot="icon-only" name="filter-outline" />
      </ion-button>
      <ion-button
        (click)="openSort()"
        [attr.aria-label]="'Sort by ' + sortMeta[store.sort()].label"
      >
        <ion-icon slot="icon-only" name="swap-vertical-outline" />
      </ion-button>
      <ion-button (click)="openShoppingList()" aria-label="Shopping list">
        <ion-icon slot="icon-only" name="cart-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Type and aisle filters stay visible; shopping status lives in the toolbar. -->
  <app-filter-bar
    label="Filter by type"
    [options]="typeOptions"
    [selected]="store.type()"
    (selectedChange)="selectType($event)"
  />
  <app-filter-bar
    class="secondary"
    label="Filter by category"
    [options]="categoryOptions()"
    [selected]="store.category()"
    (selectedChange)="selectCategory($event)"
  />
</ion-header>

<ion-content>
  @if (store.loading()) {
    <div class="state"><ion-spinner name="crescent" /></div>
  } @else if (store.error()) {
    <div class="state"><p class="text-muted">{{ store.error() }}</p></div>
  } @else if (store.visibleItems().length === 0) {
    <div class="state">
      <p class="text-muted">No products match these filters.</p>
    </div>
  } @else {
    <div class="grid">
      @for (item of store.visibleItems(); track item.product.id) {
        <app-product-card
          [item]="item"
          (statusChanged)="handleStatusChange($event)"
          (variantsOpened)="openVariants($event)"
          (settingsOpened)="openSettings($event)"
        />
      }
    </div>
  }
</ion-content>

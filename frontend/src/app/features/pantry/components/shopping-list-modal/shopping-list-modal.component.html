<ion-header>
  <ion-toolbar>
    <ion-title>Shopping list</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (text()) {
    <pre class="preview">{{ text() }}</pre>
  } @else {
    <p class="empty text-muted">There are no products in the cart.</p>
  }
</ion-content>

@if (text()) {
  <ion-footer>
    <ion-toolbar>
      <ion-button expand="block" class="copy" (click)="copy()">
        <ion-icon slot="start" name="copy-outline" />
        Copy
      </ion-button>
    </ion-toolbar>
  </ion-footer>
}

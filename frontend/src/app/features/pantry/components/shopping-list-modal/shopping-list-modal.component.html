<ion-header>
  <ion-toolbar>
    <ion-title>Shopping list</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="options">
    <ion-checkbox
      labelPlacement="end"
      justify="start"
      [checked]="includeLow()"
      (ionChange)="includeLow.set($event.detail.checked)"
    >
      Also include products running low
    </ion-checkbox>
  </div>

  @if (text()) {
    <pre class="preview">{{ text() }}</pre>
    <ion-button expand="block" class="copy" (click)="copy()">
      <ion-icon slot="start" name="copy-outline" />
      Copy
    </ion-button>
  } @else {
    <p class="empty text-muted">Nothing to buy with these filters.</p>
  }
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-title>{{ item.product.name }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="section">
    <h2>Type</h2>
    <ion-segment
      [value]="currentType()"
      (ionChange)="selectedType.set($any($event.detail.value))"
    >
      @for (type of types; track type) {
        <ion-segment-button [value]="type">
          <ion-label>{{ typeMeta[type].label }}</ion-label>
        </ion-segment-button>
      }
    </ion-segment>
  </div>

  <div class="section">
    <h2>Category</h2>
    <div class="options">
      @for (category of categories; track category) {
        <button
          type="button"
          class="option"
          [class.selected]="currentCategory() === category"
          [attr.aria-pressed]="currentCategory() === category"
          (click)="selectedCategory.set(category)"
        >
          {{ categoryMeta[category].label }}
        </button>
      }
    </div>
  </div>

  <ion-button expand="block" class="save" (click)="save()">Save</ion-button>
</ion-content>

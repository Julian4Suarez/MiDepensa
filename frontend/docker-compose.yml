# Development compose — two modes:
#   make dev          → Angular dev server with hot reload (:4200)
#   make docker-start → production build served by nginx (:4201)
name: midepensa-frontend

services:
  dev:
    image: node:22-alpine
    container_name: midepensa_dev_server
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 500"
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  frontend:
    profiles: [smoke]
    build: .
    image: midepensa-frontend
    container_name: midepensa_dev_frontend
    restart: unless-stopped
    ports:
      - "4201:8080"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080/v1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3

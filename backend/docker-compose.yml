# Development compose — two modes:
#   make services-start → postgres only (app runs on the host with `air`)
#   make docker-start   → postgres + app in Docker (smoke test)
#
# The project name is pinned so containers and volumes never collide with
# another compose project that also lives in a directory called "backend".
name: midepensa-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: midepensa_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-midepensa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-midepensa_password}
      POSTGRES_DB: ${DB_NAME:-midepensa_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-midepensa_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: [smoke]
    build: .
    image: midepensa-backend
    container_name: midepensa_dev_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
      AUTO_MIGRATE: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-midepensa_user}
      DB_PASSWORD: ${DB_PASSWORD:-midepensa_password}
      DB_NAME: ${DB_NAME:-midepensa_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    healthcheck:
      # -O /dev/null issues a GET; --spider would send HEAD, which gin does not route.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
